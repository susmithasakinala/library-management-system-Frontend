<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue / Return</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="students.html">Students</a>
      <a href="issue.html">Issue / Return</a>
            <a href="history.html">History</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="card">
      <h2>Issue a Book</h2>
      <select id="studentSelect"><option value="">Select Student</option></select>
      <select id="bookSelect"><option value="">Select Book</option></select>
      <button class="primary" onclick="issueBook()">Issue Book</button>
      <p id="msg"></p>
      <p class="note">Books must be returned within 14 days. Late returns are fined as per the rules book on the dashboard.</p>
    </div>
    <div class="card">
      <h2>Currently Issued Books</h2>
      <table>
        <thead><tr><th>Student</th><th>Book</th><th>Issue Date</th><th>Due Date</th><th>Fine</th><th>Action</th></tr></thead>
        <tbody id="issueTable"></tbody>
      </table>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issue.js"></script>
</body>
</html>
