<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Manage Books</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="students.html">Students</a>
      <a href="issue.html">Issue / Return</a>
            <a href="history.html">History</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="card">
      <h2 id="formTitle">Add Book</h2>
      <input type="hidden" id="bookId">
      <input type="hidden" id="available">
      <input id="title" placeholder="Title">
      <input id="author" placeholder="Author">
      <input id="isbn" placeholder="ISBN">
      <input id="category" placeholder="Category">
      <input id="quantity" type="number" placeholder="Quantity">
      <button class="primary" onclick="saveBook()">Save Book</button>
      <p id="msg"></p>
    </div>
    <div class="card">
      <input placeholder="Search by title, author or ISBN" oninput="searchBooks(this.value)">
      <table>
        <thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Qty</th><th>Available</th><th>Actions</th></tr></thead>
        <tbody id="bookTable"></tbody>
      </table>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
