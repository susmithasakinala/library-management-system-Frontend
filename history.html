<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue History</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="students.html">Students</a>
      <a href="issue.html">Issue / Return</a>
      <a href="history.html">History</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="card">
      <h2>Issue History</h2>
      <p>Every book ever issued, newest first, including returned books and the fines paid.</p>
      <select style="max-width:220px" onchange="filterHistory(this.value)">
        <option value="ALL">All records</option>
        <option value="ISSUED">Currently issued</option>
        <option value="RETURNED">Returned</option>
      </select>
      <table>
        <thead>
          <tr><th>Student</th><th>Book</th><th>Issue Date</th><th>Due Date</th><th>Return Date</th><th>Status</th><th>Fine</th></tr>
        </thead>
        <tbody id="historyTable"></tbody>
      </table>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
