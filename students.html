<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Manage Students</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="books.html">Books</a>
      <a href="students.html">Students</a>
      <a href="issue.html">Issue / Return</a>
            <a href="history.html">History</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="container">
    <div class="card">
      <h2 id="formTitle">Add Student</h2>
      <input type="hidden" id="studentId">
      <input id="name" placeholder="Name">
      <input id="rollNo" placeholder="Roll Number">
      <input id="department" placeholder="Department">
      <input id="phone" placeholder="Phone">
      <button class="primary" onclick="saveStudent()">Save Student</button>
      <p id="msg"></p>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Roll No</th><th>Department</th><th>Phone</th><th>Actions</th></tr></thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
